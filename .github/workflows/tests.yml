name: Tests
on: [push, pull_request]
jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m coverage run --source=app,interface,shortcuts,contacts,voice,catalog,document_reader,attachment_selection,attachment_picker,greeting,style_history,mail_batch -m unittest discover -v
      - run: python -m coverage report
